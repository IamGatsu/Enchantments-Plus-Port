# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Fabric Properties
# PORT-NOTE: Seit Minecraft 26.1 stellt Fabric KEINE Yarn-Mappings mehr bereit.
# Mods werden gegen Mojangs offizielle Mappings gebaut, Loom remappt nichts mehr
# (kein "modImplementation"/"remapJar" mehr, siehe build.gradle).
# Bitte VOR dem ersten Build auf https://fabricmc.net/develop/ und
# https://docs.fabricmc.net/develop/porting/ die tagesaktuellen Versionsnummern
# gegenpruefen - die Werte unten sind Stand der Recherche (Sept. 2026) und
# koennen zwischenzeitlich veraltet sein.
minecraft_version=26.2
loader_version=0.19.3
# PORT-NOTE: Diese Zeile wird NICHT mehr automatisch gelesen - der
# plugins{}-Block in build.gradle akzeptiert keine Variablen, daher ist die
# Loom-Version dort fest eingetragen (aktuell '1.17-SNAPSHOT'). Wenn du hier
# eine andere Version eintraegst, denk daran, sie auch in build.gradle zu
# aendern.
loom_version=1.17

# Mod Properties
mod_version=1.3.0+26.2
maven_group=net.robdog777
archives_base_name=enchantments-plus-fabric

# Dependencies
# PORT-NOTE: Fabric API Versionsnummer fuer 26.2. Bestaetigt durch ein
# tatsaechlich bereits fuer 26.2 veroeffentlichtes Fabric-Mod (GitHub-Release,
# Stand Recherche), das "Fabric API 0.153.0+26.2" und "Fabric Loader 0.19.3"
# als Anforderung nennt - deckt sich mit loader_version oben. Trotzdem vor
# dem Bauen auf Modrinth die dann aktuellste 26.2-Version gegenpruefen.
fabric_version=0.153.0+26.2

# PORT-NOTE (Fix): Platzhalter durch die aktuell neuesten fuer 26.2
# veroeffentlichten Versionen ersetzt (Stand Recherche: Sept. 2026):
# - cloth-config: [Fabric 26.2] v26.2.155, veroeffentlicht 18. Juni 2026
#   (https://modrinth.com/mod/cloth-config, https://www.curseforge.com/minecraft/mc-mods/cloth-config)
# - modmenu: v20.0.1 fuer 26.2, veroeffentlicht 9. Juli 2026
#   (https://modrinth.com/mod/modmenu)
# Bitte trotzdem kurz auf den jeweiligen Seiten gegenpruefen, falls seither
# eine neuere 26.2-Version erschienen ist.
cloth_config_version=26.2.155
mod_menu_version=20.0.1
